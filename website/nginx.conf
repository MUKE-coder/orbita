server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip text assets.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # VitePress uses clean URLs (cleanUrls: true): a link to /docs/install maps
    # to the file /docs/install.html. Try the path, then .html, then a dir
    # index, then fall back to the SPA 404 page.
    location / {
        # =404 (not /404.html) so unmatched paths return a real 404 status;
        # error_page then serves the styled 404 page with that status.
        try_files $uri $uri.html $uri/ =404;
    }

    # Hashed build assets are immutable — cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    error_page 404 /404.html;
}
