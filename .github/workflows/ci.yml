name: CI

on:
  push:
    branches: [main, grit-cloud]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race

  # Non-blocking: golangci-lint's release binary lags the Go toolchain (its
  # go1.24 build refuses to analyze go1.25 code). `go vet` in the test job above
  # is the blocking correctness gate; this job runs the linter for signal only.
  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
